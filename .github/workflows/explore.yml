name: Exploration
on: { push: { branches: [exploration] } }
permissions: { contents: write }
jobs:
  e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node explore.mjs || true
      - run: |
          git config user.name robot; git config user.email robot@users.noreply.github.com
          git add out && git commit -qm "résultats" && git push
