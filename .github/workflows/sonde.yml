name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in trad/registre.json trad/enfr/vocab.fren.spm.gz trad/enfr/model.enfr.intgemm.alphas.bin.gz js/trad/worker/bergamot-translator-worker.wasm js/traduire.js; do
            echo "== $f"; curl -sS -o /tmp/x -D - -H "Accept-Encoding: gzip, br" "https://medyapam.web.app/$f" | grep -i "^HTTP\|content-type\|content-encoding\|content-length\|cache-control"; head -c 2 /tmp/x | xxd | head -1
          done
