name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://storage.googleapis.com/bergamot-models-sandbox/0.3.3
          for f in enfr/model.enfr.intgemm.alphas.bin.gz enfr/model.enfr.intgemm.alphas.bin enfr/vocab.fren.spm.gz; do
            echo "== $f"; curl -sS -o /dev/null -D - -H "Origin: https://medyapam.web.app" "$B/$f" | grep -i "^HTTP\|access-control\|content-length\|content-type\|content-encoding"
          done
          echo "== OPTIONS"; curl -sS -o /dev/null -D - -X OPTIONS -H "Origin: https://medyapam.web.app" -H "Access-Control-Request-Method: GET" "$B/enfr/vocab.fren.spm.gz" | grep -i "^HTTP\|access-control"
