name: Calendriers des golfs
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node crawl.mjs
      - run: |
          git config user.name "PinIQ robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/compets.json
          git diff --cached --quiet || git commit -m "Calendriers des golfs"
          git push
