# Toutes les 6 heures (seuls les carreaux de plus de 6 jours sont relus) : lieux de sortie de toute la France (OpenStreetMap) pour An Nou Alé
name: Lieux de sortie
on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lieux:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node lieux.mjs
      - run: |
          git config user.name "An Nou Alé robot"
          git config user.email "robot@users.noreply.github.com"
          git add lieux/
          git diff --cached --quiet || git commit -m "Lieux de sortie"
          git pull --rebase
          git push
