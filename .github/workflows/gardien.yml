# Toutes les heures : PinIQ et Popote & Co répondent-ils ? Sinon, alerte ntfy (chaque appli sur son propre sujet)
name: Gardien des applis
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
jobs:
  gardien:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Vérifier les applis
        run: |
          ok() { curl -fsS -m 20 "$1?gardien=$(date +%s)" | grep -q "$2"; }
          alerte() { curl -s -H "Content-Type: application/json" -d "{\"topic\":\"$1\",\"title\":\"⚠️ $2 ne répond plus\",\"message\":\"La page $3 ne s'affiche pas depuis 2 minutes. Le gardien revérifie toutes les heures.\",\"tags\":[\"rotating_light\"],\"priority\":5}" https://ntfy.sh/; }
          echec=0
          while IFS='|' read -r nom url mot sujet; do
            if ok "$url" "$mot"; then echo "$nom répond"; continue; fi
            sleep 90
            if ok "$url" "$mot"; then echo "$nom répond (2e essai)"; continue; fi
            alerte "$sujet" "$nom" "$url"; echo "::error::$nom ne répond pas"; echec=1
          done <<'LISTE'
          PinIQ|https://caddybook-957f3.web.app/|PinIQ|caddybook-d4535629da
          Popote & Co|https://popote-2026.web.app/|Popote|popote-co-acece3a890b5
          LISTE
          exit $echec
