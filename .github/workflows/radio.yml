# Trois fois par jour : radios d'Haïti qui jouent vraiment dans Medyapam (radio/haiti.json)
name: Radios d'Haïti
on:
  schedule:
    - cron: "23 5,13,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node radio.mjs
      - run: |
          git config user.name "Medyapam robot"
          git config user.email "robot@users.noreply.github.com"
          git add radio/
          git diff --cached --quiet || git commit -m "Radios d'Haïti"
          git pull --rebase
          git push
